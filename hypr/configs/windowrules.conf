# Matrix dotfiles - Window rules
# The applications below are optional; config stays functional without them.

# Float file picker dialogs from Thunar (and other GTK apps)
windowrule = float, class:^(thunar)$, title:^(File Operations|Open File|Save File|Mở tệp|Lưu tệp.*)$
windowrule = size 800 550, class:^(thunar)$, title:^(File Operations|Open File|Save File|Mở tệp|Lưu tệp.*)$

# Float audio control (optional app)
windowrule = float, class:^(pavucontrol)$
windowrule = size 800 500, class:^(pavucontrol)$

# Picture-in-picture: float, pin on top, keep aspect ratio
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = keepaspectratio, title:^(Picture-in-Picture)$
windowrule = size 960 540, title:^(Picture-in-Picture)$
