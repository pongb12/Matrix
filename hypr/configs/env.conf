# Matrix dotfiles - Environment variables
# Only variables that are actually useful for a Wayland session.

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

# NOTE: Do NOT set AQ_DRM_DEVICES here. Hyprland/Aquamarine auto-detects the
# Intel GPU. Only set it (e.g. env = AQ_DRM_DEVICES,/dev/dri/card0) when an
# explicit DRM device selection is actually required (multi-GPU setups).

# NOTE: Do NOT set LANG or LC_* here. System locale is managed by the distro
# (Arch, CachyOS, ...). Set it once with localectl or /etc/locale.conf.
