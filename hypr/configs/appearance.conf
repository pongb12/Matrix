# Matrix dotfiles - Appearance (low-spec tuned)
# Target: Intel UHD 605 iGPU, 4GB RAM. No blur, no shadows, fast animations.

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(88c0d0ee) rgba(81a1c1ee) 45deg
    col.inactive_border = rgba(4c566a66)
    layout = dwindle
    resize_on_border = true
}

decoration {
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    rounding = 6
}

animations {
    enabled = true

    # Short durations (2-3) to mask low framerates on weak iGPUs
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 3, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = border, 1, 3, default
    animation = fade, 1, 2, smoothIn
    animation = workspaces, 1, 3, overshot, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
