# Matrix dotfiles - Autostart
# Keep background processes minimal. Each line expects the binary to exist:
#   swaybg, dunst, waybar
# If a binary is missing, Hyprland just logs a spawn error; the session stays usable.

# Wallpaper (extremely low RAM footprint)
exec-once = swaybg -i ~/Pictures/wallpaper.jpg -m fill

# Notification daemon
exec-once = dunst

# Status bar
exec-once = waybar

# Network tray icon (optional; needs network-manager-applet)
exec-once = nm-applet
