# Matrix dotfiles - Hyprland entry point
# This file only sources modular configs; keep it thin.
# Deployed to ~/.config/hypr/hyprland.conf by install.sh

source = ~/.config/hypr/configs/env.conf
source = ~/.config/hypr/configs/monitors.conf
# Display state written by scripts/multi-display.sh (Super+P).
# Keep this AFTER monitors.conf so an explicit mode wins over auto-detection.
source = ~/.config/hypr/configs/displays.conf
source = ~/.config/hypr/configs/appearance.conf
source = ~/.config/hypr/configs/keybinds.conf
source = ~/.config/hypr/configs/windowrules.conf
source = ~/.config/hypr/configs/autostart.conf
